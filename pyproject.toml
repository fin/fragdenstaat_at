[project]
name = "fragdenstaat_at"
readme = "README.md"
license = { file = "LICENSE.txt" }
requires-python = ">=3.12"
description = "FragDenStaat.at theme for Froide install"
version = "0.1.0"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: Django",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Topic :: Utilities",
]
# Adopted from fragdenstaat_de (D6). Deliberate omissions, because AT does not
# enable these apps (verified against the runtime INSTALLED_APPS, not the source):
#   froide-campaign, froide-food, froide-fax, froide-legalaction, froide-exam,
#   froide-crowdfunding, froide-govplan, froide-evidencecollection,
#   froide-pressconference, froide-election, django-amenities,
#   django-legal-advice-builder, osmium (OSM/amenities),
#   torch + torchvision (only needed by fds_fximport's captcha solver, and D3
#   keeps fds_fximport out -- this also drops ~2 GB from the image).
# Kept ahead of need: django-flowcontrol and mjml-python are required by
# fds_newsletter/fds_mailing, which D3 restores.
dependencies = [
  "celery>=5.2.2",
  "cryptography>=43.0.1",
  "pyopenssl>=22.0.0",
  "channels>=4.2.2",
  "daphne>=4.1.2",
  "dj-database-url>=2.3.0",
  "django-admin-sortable2>=2.2.8",
  "django-celery-beat>=2.8.1",
  "django-celery-email>=3.0.0",
  "django-cms>=5.0.5,<6",
  "django-configurations>=2.5.1",
  "django-contractor>=0.0.8",
  "django-contrib-comments>=2.2.0",
  "django-cookie-consent>=0.6.0,<1.0.0",
  "django-crossdomainmedia>=0.0.4",
  "django-datashow>=0.1.10",
  "django-elasticsearch-dsl>=8.0,<9.0",
  "django-filer>=3.0.0",
  "django-filingcabinet @ git+https://github.com/okfde/django-filingcabinet.git@main",
  "django-filter>=25.1",
  "django-flowcontrol>=0.0.19",
  "django-leaflet>=0.31.0",
  "django-localflavor>=3.1",
  "django-logentry-admin>=1.1.0",
  "django-mfa3>=1.0.0",
  "django-parler>=2.3",
  "django-sekizai>=4.1.0",
  "django-storages>=1.14.6",
  "django-taggit>=6.1.0",
  "django-tinymce>=3.5.0",
  "django-treebeard>=5",
  "django>=5.2,<5.3",
  "djangocms-alias>=3.1.0",
  "djangocms-audio>=2.1.1",
  "djangocms-frontend>=2.4.0",
  "djangocms-link>=5.0.1",
  "djangocms-icon>=2.1.0",
  "djangocms-picture>=4.1.1",
  "djangocms-text>=0.9.1",
  "djangocms-transfer>=2.0.1",
  "djangocms-versioning>=2.5.1",
  "djangocms-video>=3.1.0",
  "djangorestframework>=3.16.0",
  "djangorestframework-csv>=3.0.2",
  "djangorestframework-jsonp>=1.0.2",
  "dogtail @ git+https://github.com/okfde/dogtail.git@d2f341cab0f05ef4e193f0158fe5a64aadc5bae6",
  "drf-spectacular>=0.28.0",
  "elasticsearch-dsl>=8.0.0,<9.0.0",
  "elasticsearch<9.0.0,>=8.0.0",
  "geoip2>=4.8.0",
  "html-text>=0.7.0",
  "icalendar>=6.3.1",
  "jsonschema>=4.23.0",
  "lxml[html-clean]>=5.3.0",
  "markdown>=3.8",
  "mjml-python>=1.3.5",
  "nh3",
  "num2words>=0.5.14",
  "openpyxl>=3.1.5",
  "pandas>=2.2.2",
  "pgpy>=0.6.0",
  "phonenumbers>=8.13.45",
  "pillow>=12.1.0",
  "pikepdf>=9.7.0",
  "psycopg[binary]>=3.2.9",
  "pyisemail>=2.0.1",
  "pypdf>=5.5.0",
  "python-dateutil",
  "python-magic>=0.4.27",
  "python-mimeparse>=2.0.0",
  "python-slugify>=8.0.4",
  "reportlab>=4.4.1",
  "requests>=2.32.3",
  "unidecode>=1.3.8",
  "wand>=0.6.13",
  "weasyprint>=65.1",
  "webp>=0.4.0",
  "websockets>=13.0.1",
  "xlrd>=2.0.1",
  "froide @ git+https://github.com/okfde/froide.git@main",
  # TEMPORARY fork pin. okfde/main sends application_context.locale =
  # settings.LANGUAGE_CODE verbatim, so AT sends "de-at", which is not valid
  # BCP-47 (the region subtag must be uppercase) and PayPal rejects the whole
  # /v1/billing/subscriptions request with "violates schema" -- every recurring
  # PayPal donation 400s. DE sends a bare "de" and never hits it.
  #
  # 2026-08-de-sync is okfde/main plus the three Austria-specific one-liners
  # from the old fin fork, rebased: this locale fix in both subscription paths,
  # and "de-at" added to Stripe's get_stripe_locales. Public over https, so no
  # deploy key needed.
  #
  # Exit criterion: upstream them to okfde/froide-payment and repin to @main.
  # Tracked in MERGE_PLAN.md 9.9.
  "froide-payment @ git+https://github.com/fin/froide-payment.git@2026-08-de-sync",
  # Fork pin, not a fork of convenience. fin/main carries webhook hardening
  # (replay + malformed-envelope rejection), classification of permanently
  # undeliverable faxes so they stop being retried, Telnyx's OpenAPI examples as
  # fixtures, README_LIVE_TESTS.md for the one thing no offline test can prove
  # -- that our signature verification interoperates with Telnyx's signing
  # rather than nacl agreeing with nacl -- and FAX_BACKEND, which lets dev
  # render a fax letter and its PDF without a Telnyx account.
  #
  # Not on okfde: AT is running ahead of upstream here, so unlike the
  # froide-payment pin there is no "repin to @main upstream" exit criterion --
  # okfde would have to catch up first. MERGE_PLAN.md 9.13.
  "froide-fax @ git+https://github.com/fin/froide-fax.git@main",
  "sortabletable @ git+https://github.com/stefanw/djangocms-sortabletable.git@main",
  "fcdocs-annotate @ git+https://github.com/okfde/fcdocs-annotate.git@main",
  # QR codes on outgoing fax letters (docs/qr-code-on-faxes.md). segno rather
  # than qrcode: pure Python, no Pillow, and emits SVG, which stays vector
  # through WeasyPrint -- sharp edges are what survives a 204x98 dpi fax.
  # qrcode is present only because django-mfa3 requires it; nothing declares it
  # directly, so it would vanish the day froide changes MFA library.
  "segno>=1.6",
  "qrcode>=7.3.1",
  "pytesseract>=0.3.13",
]

[project.optional-dependencies]
production = [
  "gunicorn",
  "pymemcache",
  "channels_redis==4.1.0",
  "uvicorn",
  "sentry-sdk>=2.29.0",
]

[dependency-groups]
dev = [
  "django-debug-toolbar>=3.2.1",
  "django-extended-makemessages>=1.7.1",
  # froide's test package (imported by the vendored fds_newsletter tests) needs
  # bs4; froide is installed with --no-deps so it does not come along.
  "beautifulsoup4",
  "factory-boy>=3.3",
  "faker",
  "mock",
  "pbr",
  "djlint",
  "pycodestyle",
  "pyflakes",
  "pytest-django",
  "django-coverage-plugin",
  "tblib",
  "time-machine>=2.16",
  "honcho",
  "ipdb",
  "ipython",
  "polib",
  "pytest-xdist>=3.8.0",
  "pytest-cov>=7.1.0",
  # Async, not the sync pytest-playwright: DE's browser tests (fds_donation's
  # test_banktransfer/test_stripe/test_paypal) are `async def` and await the
  # Page. The two plugins both define a `page` fixture and cannot coexist, so
  # AT's own browser test is async too (tests/test_donation.py).
  "pytest-playwright-asyncio>=0.7.2",
  # Pulled in by pytest-playwright-asyncio, but named explicitly because
  # fds_donation's tests carry @pytest.mark.asyncio. Running the Stripe ones
  # also needs the Stripe CLI and test keys -- see MERGE_PLAN.md 9.3.
  "pytest-asyncio>=0.24",
  # The browser tests drive third-party sandboxes and have hung indefinitely
  # more than once: an unbounded retry loop, and a Queue.get() waiting on a
  # subprocess that never started. --timeout turns those into a stack trace
  # instead of a run that looks merely slow.
  "pytest-timeout>=2.4",
  # pytest-factoryboy < 2.8 calls __pytest_wrapped__ on a fixture, which modern
  # pytest no longer exposes, so collection of fds_donation's conftest dies with
  # AttributeError: 'FixtureFunctionDefinition' object has no attribute
  # '__pytest_wrapped__'. AT's lock had drifted to 2.5.1 while DE resolved 2.8.1.
  # The floor is on factoryboy, not pytest -- do not "fix" this by pinning pytest.
  "pytest-factoryboy>=2.8.1",
  "ruff>=0.6.0",
]

[tool.uv]
override-dependencies = ["numpy<2.4.0"]
# django-payments comes in through froide-payment, which declares it
# unconstrained. AT's lock had pinned it at 1.0.0 since the 2023 fork -- two
# majors behind DE -- while froide-payment@main is developed against 3.x.
#
# The cap is not caution, it is a hard incompatibility. django-payments 4.0.0
# dropped StripeProvider (deprecated in 3.0.0); 4.1.0's payments/stripe/
# exports StripeProviderV3 and nothing else. froide_payment/provider/stripe.py
# still does `from payments.stripe import StripeProvider` and subclasses it for
# StripeSofortProvider, and provider/__init__.py imports that unconditionally,
# so on 4.x `import froide_payment.provider` raises ImportError and the site
# does not boot -- including the Stripe/PayPal providers AT does use.
#
# Lifting the cap needs a froide-payment change (port StripeSofortProvider to
# StripeProviderV3, or drop it -- AT has it commented out in production.py
# already), not a version bump here. DE is on 3.1.0 too, but by lock inertia
# rather than by decision: DE declares no bound either.
constraint-dependencies = ["django-payments>=3.1,<4"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fragdenstaat_at"]

[tool.coverage.run]
source = ["fragdenstaat_at"]
omit = ["*/migrations/*", "*/wsgi.py", "*/asgi.py"]
plugins = ["django_coverage_plugin"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover"]

[tool.ruff]
exclude = ["migrations", "build", "node_modules"]

[tool.ruff.lint]
ignore = ["E501", "C901"]
select = ["C", "E", "F", "W", "B", "I001"]

[tool.ruff.lint.pycodestyle]
max-line-length = 88

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
section-order = ["future", "standard-library", "django", "third-party", "froide", "first-party", "local-folder"]
default-section = "third-party"

[tool.ruff.lint.isort.sections]
django = ["django"]
froide = ["froide"]
