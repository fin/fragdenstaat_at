[pytest]
DJANGO_CONFIGURATION=Test
DJANGO_SETTINGS_MODULE = fragdenstaat_at.settings.test
python_files = tests.py test_*.py *_tests.py
testpaths = fragdenstaat_at tests
# TEMPORARY (D3 step 1 -> step 2): fds_newsletter and fds_mailing are vendored
# from fragdenstaat_de but not yet in INSTALLED_APPS, so their own test modules
# cannot import. Remove these two lines in the same commit that wires the apps up.
addopts = --ignore=fragdenstaat_at/fds_newsletter --ignore=fragdenstaat_at/fds_mailing
