name: FragDenStaat CI

on: push

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      # Runs .pre-commit-config.yaml: ruff, ruff-format and eslint.
      - uses: j178/prek-action@v1

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Dev and production both run 3.13. DE additionally tests 3.12 and
        # 3.14; widen this once the workflow is reliably green, not before --
        # `requires-python` is >=3.12, so the lock supports it.
        python-version: ['3.13']
    steps:
      - uses: actions/checkout@v6
      # compose-dev.yaml is the same stack developers run: postgis 16-3.4 and
      # the locally built Elasticsearch 8.19.3 with the German decompounder
      # dictionaries. Neither service declares a healthcheck, so `--wait` only
      # waits for "running"; the install steps below are what actually give
      # Elasticsearch time to come up.
      - name: Start services
        run: docker compose -f compose-dev.yaml up --wait
      - name: Setup uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
      - name: Install pnpm
        uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install system-level dependencies
        run: sudo apt-get update && sudo apt-get install libxml2-dev libxslt1-dev python3-dev libgdal-dev gdal-bin libmagic-dev libmagickwand-dev gettext libpoppler-cpp-dev
      - name: Install dependencies
        run: |
          uv sync --locked
          playwright install --with-deps chromium
          pnpm install
      - name: Build frontend
        run: pnpm run build
      # No `-l de`, unlike DE: AT's Austrian overrides live in de_AT, and
      # restricting the locale would leave them uncompiled and silently unused.
      - name: Compile translations
        run: python manage.py compilemessages -i node_modules
      # Settings default to the compose-dev credentials
      # (fragdenstaat_at@localhost:5432, elasticsearch on localhost:9200), so no
      # env block is needed. `-n auto` is required: pytest.ini sets
      # `--dist loadgroup`, which needs xdist actually running to pin the
      # sequential payment tests to one worker.
      - name: Run tests
        run: |
          pytest -n auto --cov --cov-report=
          coverage report --format=markdown >> $GITHUB_STEP_SUMMARY

  # Reports how far this repo has drifted from upstream fragdenstaat_de.
  # AT-only: DE is upstream and has no equivalent. Informational
  # (continue-on-error) -- a growing drift number is not a build failure, just a
  # signal to check MERGE_PLAN.md.
  #
  # The two checkouts land side by side under $GITHUB_WORKSPACE, so
  # `../fragdenstaat_de` resolves the same way it does in a dev container.
  # de_drift.py is stdlib-only and compares working trees, so it needs no
  # dependency install and is unaffected by checkout being shallow.
  de-drift:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          path: fragdenstaat_at
      - uses: actions/checkout@v6
        with:
          repository: okfde/fragdenstaat_de
          path: fragdenstaat_de
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      # The limit is a ratchet set to the current count, so any *increase* shows
      # up. It was 140 while the real figure was 142, which meant the check
      # failed on every run and its warning became noise. Raise it deliberately
      # when a sync genuinely widens the surface; never to silence it.
      #
      # The result goes to the run summary because continue-on-error hides the
      # job's status -- without this the numbers are buried in the log and the
      # job is, in effect, doing nothing.
      - name: Run drift check (non-blocking)
        working-directory: fragdenstaat_at
        shell: bash
        run: |
          set +e
          python scripts/de_drift.py --de-repo ../fragdenstaat_de \
            --check-max-modified 145 > drift.txt 2>&1
          status=$?
          cat drift.txt
          {
            echo '## Drift from fragdenstaat_de'
            echo
            echo '```'
            cat drift.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
