name: FragDenStaat CI

on: push

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
      - name: Run ruff
        run: uvx ruff check
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Run eslint
        run: pnpm lint

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # keep in sync with UV_PYTHON in devsetup.sh / requires-python in pyproject.toml
        python-version: ['3.13']
    steps:
      - uses: actions/checkout@v4
      - name: Start services
        run: docker compose -f compose-dev.yaml up --wait
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install system-level dependencies
        run: sudo apt-get update && sudo apt-get install libxml2-dev libxslt1-dev python3-dev libgdal-dev gdal-bin libmagic-dev libmagickwand-dev gettext libpoppler-cpp-dev
      - name: Install dependencies
        run: |
          uv sync --locked
          playwright install --with-deps chromium
          pnpm install
      - name: Build frontend
        run: pnpm run build
      - name: Compile translations
        run: python manage.py compilemessages -i node_modules
      - name: Run tests
        run: make testci
        env:
          DATABASE_URL: postgis://fragdenstaat_at:fragdenstaat_at@localhost:5432/fragdenstaat_at
