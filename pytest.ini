[pytest]
DJANGO_CONFIGURATION=Test
DJANGO_SETTINGS_MODULE = fragdenstaat_at.settings.test
python_files = tests.py test_*.py *_tests.py
testpaths = fragdenstaat_at tests
# D3 installs fds_newsletter for its models (Donor.subscriber, MailingMessage)
# but deliberately does not route fds_newsletter.urls -- AT exposes no signup
# surface. These two DE-authored modules drive the subscribe/confirm/unsubscribe
# views through reverse(), so they cannot pass here. Drop these ignores if
# theme/urls.py ever routes the app. See MERGE_PLAN.md D3.
addopts =
    --ignore=fragdenstaat_at/fds_newsletter/tests/test_subscribe.py
    --ignore=fragdenstaat_at/fds_newsletter/tests/test_template.py
# Same cause: a mailing embeds an unsubscribe link, so rendering one needs the
# newsletter URLs routed. AT sends no mailings under D3. Note that if mailing is
# ever enabled, a working unsubscribe route is not optional -- it is legally
# required -- so these tests must come back at the same time.
    --ignore=fragdenstaat_at/fds_mailing/tests/test_mailing.py
