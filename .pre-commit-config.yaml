repos:
  # Kept at the version in pyproject's dev group; a mismatch means CI and the
  # local venv disagree about formatting.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # - repo: https://github.com/Riverside-Healthcare/djLint
  #   rev: v1.35.2
  #   hooks:
  #     - id: djlint-reformat-django
  #     - id: djlint-django

  - repo: local
    hooks:
      - id: eslint
        name: eslint
        language: node
        files: \.(js|ts|vue)?$
        entry: pnpm lint
        args: [--no-warn-ignored]

      # froide / froide-payment are pinned in both pyproject.toml and
      # package.json; nothing else keeps the two refs in step. Dev is immune
      # (devsetup.sh links both to the sibling checkout), so this only matters
      # in CI -- hence a hook rather than a runtime check.
      - id: check-fork-pins
        name: check fork pins (frontend == backend)
        language: system
        entry: python3 scripts/check_fork_pins.py
        pass_filenames: false
        always_run: true

