[pytest]
DJANGO_CONFIGURATION = Test
DJANGO_SETTINGS_MODULE = fragdenstaat_at.settings.test
python_files = tests.py test_*.py *_tests.py
testpaths = fragdenstaat_at tests

# Markers must be registered or pytest warns on every use and -m filters silently
# match nothing. Adopted from DE, which declares these under [tool.pytest] in
# pyproject.toml -- not a section pytest reads (it wants [tool.pytest.ini_options]),
# so upstream they have no effect.
markers =
    stripe: donation tests needing Stripe test keys
    paypal: donation tests needing PayPal sandbox keys
    elasticsearch: tests needing a live Elasticsearch
    xdist_group: pin tests to one worker (provided by pytest-xdist)

addopts =
    --reuse-db
    -m "not stripe and not paypal"
    --dist loadgroup
    --ignore=.venv
# D3 installs fds_newsletter for its models (Donor.subscriber, MailingMessage) but
# deliberately does not route fds_newsletter.urls -- AT exposes no signup surface.
# These DE-authored modules drive subscribe/confirm/unsubscribe through reverse(),
# so they cannot pass here. Drop these ignores if theme/urls.py ever routes the
# app. A mailing embeds an unsubscribe link, which is why test_mailing is here too
# -- and if mailing is ever enabled a working unsubscribe route is legally
# required, so these must come back together. See MERGE_PLAN.md D3.
    --ignore=fragdenstaat_at/fds_newsletter/tests/test_subscribe.py
    --ignore=fragdenstaat_at/fds_newsletter/tests/test_template.py
    --ignore=fragdenstaat_at/fds_mailing/tests/test_mailing.py

# Third-party deprecation noise drowns out our own.
filterwarnings =
    ignore::DeprecationWarning:(?!fragdenstaat_at).*
    ignore::PendingDeprecationWarning:(?!fragdenstaat_at).*
